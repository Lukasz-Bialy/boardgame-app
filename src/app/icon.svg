<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 1 28 30">
  <!-- Ikona karty: logo PawnSpawn (components/ui.tsx → PawnSpawnLogo). Plik statyczny nie widzi zmiennych CSS strony,
       więc kolory wpisane na stałe; dopasowują się do motywu systemu (pasek kart jasny / ciemny). -->
  <style>
    .felt { fill: #6EAA80; }
    .felt-stroke { stroke: #6EAA80; }
    .beam-top { stop-color: #6EAA80; }
    .beam-bot { stop-color: #6EAA80; }
    .pawn-hi { stop-color: #E6CC9F; }
    .pawn-lo { stop-color: #B08642; }
    @media (prefers-color-scheme: light) {
      .felt { fill: #2F6B4A; }
      .felt-stroke { stroke: #2F6B4A; }
      .beam-top, .beam-bot { stop-color: #2F6B4A; }
      .pawn-hi { stop-color: #C9A15C; }
      .pawn-lo { stop-color: #704810; }
    }
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="beam-top" stop-opacity="0" />
      <stop offset="1" class="beam-bot" stop-opacity=".45" />
    </linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="pawn-hi" />
      <stop offset="1" class="pawn-lo" />
    </linearGradient>
  </defs>
  <path d="M7.5 27 L10 4 H22 L24.5 27 Z" fill="url(#beam)" />
  <ellipse cx="16" cy="27" rx="12.5" ry="3.3" class="felt felt-stroke" fill-opacity=".2" stroke-width="1.3" />
  <ellipse cx="16" cy="27" rx="7.5" ry="1.7" class="felt" fill-opacity=".55" />
  <g fill="url(#pawn)">
    <circle cx="16" cy="7.6" r="3.7" />
    <rect x="11.6" y="11.4" width="8.8" height="2" rx="1" />
    <path d="M13.4 13.2 H18.6 C18.6 17 19.6 20 21.8 22.6 H10.2 C12.4 20 13.4 17 13.4 13.2 Z" />
    <rect x="8.8" y="22.2" width="14.4" height="3.4" rx="1.7" />
  </g>
  <circle cx="14.8" cy="6.4" r="1.1" fill="#fff" fill-opacity=".45" />
  <g class="felt">
    <rect x="4.2" y="19" width="2" height="2" rx=".3" opacity=".9" />
    <rect x="25.6" y="15.5" width="2" height="2" rx=".3" opacity=".8" />
    <rect x="6.4" y="11" width="1.6" height="1.6" rx=".3" opacity=".6" />
    <rect x="24" y="7.5" width="1.6" height="1.6" rx=".3" opacity=".5" />
  </g>
</svg>
